<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PX4 이륙 · 2초 호버 · 착륙</title>
<style>body{background:#101720;color:#eaf1f8;font:17px system-ui;max-width:900px;margin:40px auto;padding:20px}h1{font-size:28px}.card{background:#1c2835;padding:22px;border-radius:12px;margin:18px 0}#profile{font-size:24px;color:#ffdc78}button{font:inherit;padding:16px;margin:8px 8px 8px 0;border:0;border-radius:8px;background:#ffbb57;color:#111}button:disabled{opacity:.35}#land{background:#ff776d}pre{font:13px monospace;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#aabacb}</style>
<h1>TAKEOFF → 2초 호버 → LAND</h1>
<div class="card"><strong id="profile">연결 확인 중</strong><p id="route">출발 고도에서 +1.3m · 안정 확인 후 2초 · 착륙 및 시동 해제 확인</p><p class="muted">START 순간의 PX4 위치를 출발점으로 저장합니다. 높이는 출발점 대비 상승량입니다. 이 화면은 flow·ToF 기반 제자리 시험이며, UWB 상시 융합·창고 이동 준비 상태와 별개입니다.</p></div>
<div class="card"><p id="state">대기</p><p id="outcome"></p><p id="blocker"></p><p id="rcEvidence" class="muted"></p><ul id="checks"></ul><button id="start" disabled>1회 이륙 시험 START</button><button id="land" disabled>중단 / LAND</button><p id="reply"></p></div>
<details><summary>PX4 수신 상태</summary><pre id="raw"></pre></details>
<script>
let latest=null,token='',busy=false,lastGood=0;
const el=id=>document.getElementById(id);
const checks={output_enabled:'명령 활성',telemetry:'최신 FC 상태',estimator:'PX4 위치 추정',global_reference:'자동 Hold용 PX4 전역 기준',rc:'조종기 수신',disarmed_on_ground:'지상·시동 해제',position_mode:'Position 모드',rc_handoff_policy:'RC 인계 근거 또는 첫 비행 평가 선택',stationary_hold:'유효한 위치 추정 후 3초 정지',px4_auto_rc_override:'FC 자동 모드 스틱 인계 설정',battery:'배터리 확인·잔량 20% 이상',parameters:'이륙 높이·RC 매핑',command_services:'명령 연결',unused_session:'새 시험 세션',log:'기록 가능'};
const reasons={PX4_GLOBAL_REFERENCE_NOT_READY:'자동 Hold용 PX4 전역 위치가 아직 유효하지 않음',WAIT_STATIONARY_3_SECONDS:'이륙 전 정지 상태 3초 유지 확인 중',PX4_AUTO_RC_OVERRIDE_DISABLED:'FC 자동 모드 스틱 인계 설정 확인 필요',RC_HANDOFF_NOT_VERIFIED:'실제 조종권 인계 검증 필요',BATTERY_NOT_CONFIRMED:'배터리 상태 확인 필요',BATTERY_LOW:'배터리 잔량 부족',LOG_WRITE_FAILED:'기록 실패',OUTPUT_NOT_ENABLED:'실기 출력 잠김 — 검증 미완료',NEW_SESSION_REQUIRED:'이번 실행 종료. 자동 재시작하지 않습니다.',PX4_ESTIMATOR_NOT_READY:'PX4 위치·속도 추정 조건 미충족 · 3초 정지 확인도 대기 중',SELECT_RC_POSITION_MODE:'RC를 Position 모드로 선택하세요.',RC_NOT_READY:'RC 수신 확인 필요',PX4_PARAMETERS_NOT_CONFIRMED:'PX4 기본 이륙 높이·RC 매핑 확인 중',TELEMETRY_NOT_FRESH:'PX4 수신 끊김',CENTER_RC_STICKS:'RC 스틱 중앙 확인 필요'};
async function poll(){try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'수신 실패');latest=d.status;token=d.csrf;lastGood=Date.now();el('profile').textContent=latest.profile==='SITL'?'SITL · 가상 PX4':'실물 PX4 · '+(latest.output_enabled?'명령 활성':'관측 전용');el('route').textContent=`출발 고도에서 +${latest.takeoff_height_m}m · 안정 확인 후 2초 · 착륙 및 시동 해제 확인`;el('state').textContent=`${latest.phase} / ${latest.mode} / ${latest.armed?'ARMED':'DISARMED'}`;el('outcome').textContent=`결과: ${latest.outcome} · ${latest.reason||'대기'} · 착륙 확인: ${latest.landing_verified?'완료':'미확인'}`;el('checks').replaceChildren(...Object.entries(latest.preflight_checks||{}).map(([name,ok])=>{const li=document.createElement('li');li.textContent=(ok?'✓ ':'✕ ')+(checks[name]||name);return li;}));el('blocker').textContent=reasons[latest.start_blocker]||latest.start_blocker||'START 가능';el('rcEvidence').textContent=latest.rc_handoff_evaluation?'RC 실물 자동 인계: 미검증 · 이번 첫 비행에서 평가합니다. RC 개입 후 자동 재개하지 않습니다.':'';el('raw').textContent=JSON.stringify(latest,null,2);const killOn=latest.rc_channels?.[6]>1500;if(killOn&&latest.phase==='IDLE')el('blocker').textContent='비상정지 ON · START 잠김'+(latest.start_blocker?' / '+(reasons[latest.start_blocker]||latest.start_blocker):'');el('start').disabled=busy||!!latest.start_blocker||killOn;el('land').disabled=busy||!['TAKEOFF_MODE','ARM','CLIMB','HOVER','LANDING','ABORTING'].includes(latest.phase);}catch(e){latest=null;el('start').disabled=el('land').disabled=true;el('blocker').textContent='연결 끊김: '+e.message;}}
async function command(method){if(!latest||Date.now()-lastGood>1500||busy)return;const body={session:latest.session,confirm:'TAKEOFF_HOVER_2S_LAND'};busy=true;el('start').disabled=el('land').disabled=true;try{const r=await fetch('/api/'+method,{method:'POST',headers:{'Content-Type':'application/json','X-Bench-Token':token},body:JSON.stringify(body)});const d=await r.json();el('reply').textContent=d.ok?'요청 접수 · PX4 상태 확인 중':d.error;}catch(e){el('reply').textContent='응답 불명: '+e.message;}finally{busy=false;poll();}}
el('start').onclick=()=>command('start');el('land').onclick=()=>command('land');poll();setInterval(poll,500);
</script></html>
