name: Integrated field ground checks
on:
  push:
    branches: ['이번에-상원-한거-통합-브랜치']
    paths: ['src/**', '.github/workflows/integrated-ground.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ground:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 35
    env:
      ROS_DOMAIN_ID: '99'
      ROS_LOCALHOST_ONLY: '1'
      MAVLINK20: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare ROS Humble build and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake git libssl-dev libsqlite3-dev python3-pip python3-pytest python3-numpy python3-scipy python3-yaml python3-colcon-common-extensions ros-humble-mavros ros-humble-mavros-msgs
          python3 -m pip install -r src/drone_mission/requirements-field.txt
      - name: Build ROS packages and actual C++ executor
        run: |
          source /opt/ros/humble/setup.bash
          mkdir -p evidence
          colcon build --symlink-install --packages-up-to drone_mission drone_platform_link > evidence/colcon.log 2>&1
          source install/setup.bash
          cmake -S src/sangwon_AI -B .review/integrated-build -DCMAKE_BUILD_TYPE=Release > evidence/cmake.log 2>&1
          cmake --build .review/integrated-build --target sangwon_field_executor sangwon_field_executor_replay sangwon_field_mission_ai sangwon_lidar_relative_replay -j2 > evidence/build.log 2>&1
      - name: Python and C++ contracts
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          export PYTHONPATH="$PWD/src/drone_mission:$PWD/src/drone_uwb:$PWD/src/drone_platform_link:$PWD/src/drone_demo:$PWD/src/sangwon_AI/tests:${PYTHONPATH:-}"
          python3 -m pytest src/drone_mission/test/test_bridge_timeout.py src/drone_mission/test/test_native_takeoff.py src/drone_mission/test/test_local_takeoff.py src/drone_mission/test/test_local_xy.py src/drone_mission/test/test_local_web.py src/drone_mission/test/test_final_stack.py src/drone_mission/test/test_anchor_trial.py src/drone_mission/test/test_preflight.py src/drone_mission/test/test_session.py src/drone_mission/test/test_mission_chain.py src/drone_mission/test/test_operator_arm.py src/drone_mission/test/test_lidar_input.py src/drone_platform_link/test/test_observation_sources.py src/sangwon_AI/tests/test_integrated_launcher.py src/sangwon_AI/tests/test_mavros_readback.py -q --junitxml=evidence/python.xml > evidence/python.log 2>&1
          ctest --test-dir .review/integrated-build -R '^(field_executor_contracts|field_mission_ai_contracts|lidar_relative_contracts)$' --output-on-failure > evidence/contracts.log 2>&1
          sha256sum .review/integrated-build/sangwon_field_executor .review/integrated-build/sangwon_field_executor_replay .review/integrated-build/sangwon_field_mission_ai > evidence/binaries.sha256
      - name: HTTP ROS C++ synthetic FC and platform flow
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          export PYTHONPATH="$PWD/src/drone_mission:$PWD/src/drone_uwb:$PWD/src/drone_platform_link:$PWD/src/drone_demo:$PWD/src/sangwon_AI/tests:${PYTHONPATH:-}"
          python3 src/sangwon_AI/tests/field_executor_ros.py .review/integrated-build/sangwon_field_executor "$PWD/evidence/ros-flow" nominal,python_pause,bridge_delay,lidar_gap,lidar_loss,pilot,platform_link > evidence/ros-flow.log 2>&1
      - name: Preserve logs and original outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integrated-ground-${{ github.sha }}
          path: evidence/
          retention-days: 14
