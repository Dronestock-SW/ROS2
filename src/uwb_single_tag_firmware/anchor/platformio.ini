[platformio]
default_envs = anchor_a1_single, anchor_a2_single, anchor_a3_single, anchor_a4_single
src_dir = src

[env]
platform = nordicnrf52@10.12.0
board = nrf52_dk
framework = zephyr
build_src_filter =
  +<anchor_nrf52dk_ref_1to1.c>
  +<nrf52dk_ref_vendor/*.c>
upload_protocol = jlink
debug_tool = jlink
monitor_speed = 115200

[env:anchor_a1_single]
build_flags = -DANCHOR_PROFILE=1 -DUWB_FAST30_PROFILE=1

[env:anchor_a2_single]
build_flags = -DANCHOR_PROFILE=2 -DUWB_FAST30_PROFILE=1

[env:anchor_a3_single]
build_flags = -DANCHOR_PROFILE=3 -DUWB_FAST30_PROFILE=1

[env:anchor_a4_single]
build_flags = -DANCHOR_PROFILE=4 -DUWB_FAST30_PROFILE=1
