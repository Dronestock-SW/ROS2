<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PX4 이륙 · 2초 호버 · 착륙</title>
<style>body{background:#101720;color:#eaf1f8;font:17px system-ui;max-width:900px;margin:40px auto;padding:20px}h1{font-size:28px}.card{background:#1c2835;padding:22px;border-radius:12px;margin:18px 0}#profile{font-size:24px;color:#ffdc78}button{font:inherit;padding:16px;margin:8px 8px 8px 0;border:0;border-radius:8px;background:#ffbb57;color:#111}button:disabled{opacity:.35}#land{background:#ff776d}pre{font:13px monospace;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#aabacb}</style>
<h1>TAKEOFF → 2초 호버 → LAND</h1>
<div class="card"><strong id="profile">연결 확인 중</strong><p id="route">PX4 높이 1.3m · 안정 확인 후 2초 · 착륙 및 시동 해제 확인</p><p class="muted">현재 기체 위에서 수직 이륙합니다. XY 이동·UWB 융합 시험은 별도입니다.</p></div>
<div class="card"><p id="state">대기</p><p id="blocker"></p><button id="start" disabled>1회 이륙 시험 START</button><button id="land" disabled>지금 LAND</button><p id="reply"></p></div>
<details><summary>PX4 수신 상태</summary><pre id="raw"></pre></details>
<script>
let latest=null,token='',busy=false,lastGood=0;
const el=id=>document.getElementById(id);
const reasons={OUTPUT_NOT_ENABLED:'실기 출력 잠김 — 검증 미완료',NEW_SESSION_REQUIRED:'이번 실행 종료. 자동 재시작하지 않습니다.',PX4_ESTIMATOR_NOT_READY:'PX4 위치 추정 준비 안 됨',SELECT_RC_POSITION_MODE:'RC를 Position 모드로 선택하세요.',RC_NOT_READY:'RC 수신 확인 필요',PX4_PARAMETERS_NOT_CONFIRMED:'PX4 기본 이륙 높이·RC 매핑 확인 중',TELEMETRY_NOT_FRESH:'PX4 수신 끊김',CENTER_RC_STICKS:'RC 스틱 중앙 확인 필요'};
async function poll(){try{const r=await fetch('/api/status',{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'수신 실패');latest=d.status;token=d.csrf;lastGood=Date.now();el('profile').textContent=latest.profile==='SITL'?'SITL · 가상 PX4':'실물 PX4 · '+(latest.output_enabled?'명령 활성':'관측 전용');el('route').textContent=`PX4 높이 ${latest.takeoff_height_m}m · 안정 확인 후 2초 · 착륙 및 시동 해제 확인`;el('state').textContent=`${latest.phase} / ${latest.mode} / ${latest.armed?'ARMED':'DISARMED'}`;el('blocker').textContent=reasons[latest.start_blocker]||latest.start_blocker||'START 가능';el('raw').textContent=JSON.stringify(latest,null,2);el('start').disabled=busy||!!latest.start_blocker;el('land').disabled=busy||!['TAKEOFF_MODE','ARM','CLIMB','HOVER','LANDING'].includes(latest.phase);}catch(e){latest=null;el('start').disabled=el('land').disabled=true;el('blocker').textContent='연결 끊김: '+e.message;}}
async function command(method){if(!latest||Date.now()-lastGood>1500||busy)return;const body={session:latest.session,confirm:'TAKEOFF_HOVER_2S_LAND'};busy=true;el('start').disabled=el('land').disabled=true;try{const r=await fetch('/api/'+method,{method:'POST',headers:{'Content-Type':'application/json','X-Bench-Token':token},body:JSON.stringify(body)});const d=await r.json();el('reply').textContent=d.ok?'요청 접수 · PX4 상태 확인 중':d.error;}catch(e){el('reply').textContent='응답 불명: '+e.message;}finally{busy=false;poll();}}
el('start').onclick=()=>command('start');el('land').onclick=()=>command('land');poll();setInterval(poll,500);
</script></html>
