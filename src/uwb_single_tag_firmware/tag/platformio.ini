[platformio]
default_envs = tag_b_50
src_dir = src

[env]
platform = espressif32@7.0.1
board = heltec_wifi_lora_32_V3
framework = arduino
extra_scripts =
  pre:scripts/force_esp32_sdkconfig.py
  post:scripts/export_flash_layout.py
upload_protocol = esptool
monitor_speed = 921600
monitor_filters =
  time
  esp32_exception_decoder
lib_ldf_mode = deep+
build_src_filter = +<main.cpp> +<SingleTagRuntime.cpp> +<SingleTagLoRa.cpp> +<JetsonTagDisplay.cpp>
; All application libraries are bundled under lib/; no external lib_deps.
build_flags =
  -DUWB_SINGLE_TAG=1
  -DUWB_TAG_NODE_ID=6
  -DREGION_US915
  -DMCU_ESP32_S3
  -DHELTEC_BOARD=30
  -DWIFI_LORA_32_V3
  -DSLOW_CLK_TPYE=0
  -DRADIO_CHIP_SX1262
  -DLoRaWAN_DEBUG_LEVEL=0
  -DACTIVE_REGION=LORAMAC_REGION_US915
  -DLORAWAN_PREAMBLE_LENGTH=8
  -DLORAWAN_DEVEUI_AUTO=0
  -DARDUINO_HELTEC_WIFI_LORA_32_V3
  -DGPIO_PIN_COUNT=SOC_GPIO_PIN_COUNT


[env:tag_b_50]
build_flags = ${env.build_flags} -DSINGLE_TAG_RATE_HZ=50 -DSINGLE_TAG_BENCH_CONTROLS=1

[env:tag_b_40]
build_flags = ${env.build_flags} -DSINGLE_TAG_RATE_HZ=40 -DSINGLE_TAG_BENCH_CONTROLS=1

[env:tag_b_release]
build_flags = ${env.build_flags} -DSINGLE_TAG_RATE_HZ=50 -DSINGLE_TAG_BENCH_CONTROLS=0

[env:tag_b_release_40]
build_flags = ${env.build_flags} -DSINGLE_TAG_RATE_HZ=40 -DSINGLE_TAG_BENCH_CONTROLS=0
